<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0c0d0"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4d9fff"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b8b0ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e8c49a"/>
    </marker>
    <filter id="glow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#6c63ff" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="780" fill="#0f0f14"/>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" fill="#f0f0f5" font-size="24" font-weight="700" letter-spacing="0.5">GuideSight — System Architecture</text>

  <!-- Column labels -->
  <text x="120" y="70" text-anchor="middle" fill="#6a6a80" font-size="12" font-weight="600" letter-spacing="3">USER</text>
  <text x="370" y="70" text-anchor="middle" fill="#6a6a80" font-size="12" font-weight="600" letter-spacing="3">TRANSPORT</text>
  <text x="770" y="70" text-anchor="middle" fill="#6a6a80" font-size="12" font-weight="600" letter-spacing="3">GOOGLE CLOUD RUN</text>
  <text x="1210" y="70" text-anchor="middle" fill="#6a6a80" font-size="12" font-weight="600" letter-spacing="3">AI SERVICES</text>

  <!-- ==================== COLUMN 1: BROWSER ==================== -->
  <g filter="url(#sh)">
    <rect x="24" y="90" width="192" height="340" rx="14" fill="#1a1a24" stroke="#3a3a4a" stroke-width="1.5"/>
    <rect x="24" y="90" width="192" height="36" rx="14" fill="#2a2a38"/>
    <text x="120" y="114" text-anchor="middle" fill="#f0f0f5" font-size="15" font-weight="600">Browser</text>

    <!-- Camera/Mic -->
    <rect x="40" y="140" width="160" height="52" rx="8" fill="#22222e" stroke="#4a4a5a" stroke-width="1"/>
    <text x="120" y="163" text-anchor="middle" fill="#f0f0f5" font-size="13" font-weight="500">Camera + Mic</text>
    <text x="120" y="180" text-anchor="middle" fill="#8888a0" font-size="10">Video + Audio capture</text>

    <!-- React App -->
    <rect x="40" y="204" width="160" height="115" rx="8" fill="#22222e" stroke="#61dafb" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="120" y="227" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="600">React 19 App</text>
    <text x="120" y="248" text-anchor="middle" fill="#c0c0d0" font-size="11">TaskPicker</text>
    <text x="120" y="265" text-anchor="middle" fill="#c0c0d0" font-size="11">CoachingSession</text>
    <text x="120" y="282" text-anchor="middle" fill="#c0c0d0" font-size="11">StepTracker</text>
    <text x="120" y="299" text-anchor="middle" fill="#c0c0d0" font-size="11">AdminDashboard</text>

    <!-- Speaker -->
    <rect x="40" y="331" width="160" height="46" rx="8" fill="#22222e" stroke="#4a4a5a" stroke-width="1"/>
    <text x="120" y="358" text-anchor="middle" fill="#f0f0f5" font-size="13">Speaker Output</text>
    <text x="120" y="372" text-anchor="middle" fill="#8888a0" font-size="10">AI voice playback</text>
  </g>

  <!-- ==================== COLUMN 2: TRANSPORT ==================== -->
  <g filter="url(#sh)">
    <rect x="274" y="140" width="192" height="135" rx="14" fill="#0a1a3a" stroke="#005fff" stroke-width="1.8"/>
    <rect x="274" y="140" width="192" height="36" rx="14" fill="#0d2660"/>
    <text x="370" y="164" text-anchor="middle" fill="#4d9fff" font-size="14" font-weight="600">Stream Video</text>
    <text x="370" y="196" text-anchor="middle" fill="#c0c0d0" font-size="12">WebRTC Edge Network</text>
    <text x="370" y="216" text-anchor="middle" fill="#8888a0" font-size="11">TURN / STUN servers</text>
    <text x="370" y="236" text-anchor="middle" fill="#8888a0" font-size="11">VP8 codec, low-latency</text>
    <text x="370" y="256" text-anchor="middle" fill="#8888a0" font-size="11">Bidirectional audio</text>
  </g>

  <!-- ==================== COLUMN 3: CLOUD RUN ==================== -->
  <!-- Cloud Run outer container -->
  <rect x="510" y="85" width="520" height="580" rx="16" fill="none" stroke="#1a73e8" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <rect x="522" y="85" width="150" height="24" rx="7" fill="#1a73e8" opacity="0.85"/>
  <text x="597" y="101" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Google Cloud Run</text>

  <!-- Token Server -->
  <g filter="url(#sh)">
    <rect x="535" y="120" width="220" height="120" rx="10" fill="#1a1a24" stroke="#4a4a5a" stroke-width="1.5"/>
    <rect x="535" y="120" width="220" height="32" rx="10" fill="#2a2a38"/>
    <text x="645" y="142" text-anchor="middle" fill="#f0f0f5" font-size="13" font-weight="600">Token Server</text>
    <text x="645" y="142" text-anchor="middle" fill="#8888a0" font-size="10" dx="95">(Flask)</text>
    <text x="645" y="168" text-anchor="middle" fill="#c0c0d0" font-size="11">REST API + JWT tokens</text>
    <text x="645" y="186" text-anchor="middle" fill="#c0c0d0" font-size="11">Task CRUD + AI generation</text>
    <text x="645" y="204" text-anchor="middle" fill="#c0c0d0" font-size="11">Call/Task ID coordination</text>
    <text x="645" y="222" text-anchor="middle" fill="#4ade80" font-size="10">google-genai SDK</text>
  </g>

  <!-- Coaching Agent outer -->
  <g filter="url(#sh)">
    <rect x="535" y="268" width="480" height="385" rx="10" fill="#1a1a24" stroke="#4a4a5a" stroke-width="1.5"/>
    <rect x="535" y="268" width="480" height="34" rx="10" fill="#2a2a38"/>
    <text x="775" y="291" text-anchor="middle" fill="#f0f0f5" font-size="15" font-weight="700">Coaching Agent</text>
  </g>

  <!-- CV "Glasses" Pipeline - DIFFERENTIATOR -->
  <g filter="url(#glow)">
    <rect x="552" y="316" width="260" height="322" rx="12" fill="#13102a" stroke="#6c63ff" stroke-width="2.5"/>
    <rect x="552" y="316" width="260" height="32" rx="12" fill="#2d1f6e"/>
    <text x="682" y="338" text-anchor="middle" fill="#d4cfff" font-size="14" font-weight="700">CV "Glasses" Pipeline</text>

    <!-- OpenCV -->
    <rect x="568" y="362" width="228" height="72" rx="8" fill="#1a1e28" stroke="#4ade80" stroke-width="1.5"/>
    <text x="682" y="385" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="600">OpenCV</text>
    <text x="682" y="403" text-anchor="middle" fill="#c0c0d0" font-size="11">Paper detection + orientation</text>
    <text x="682" y="420" text-anchor="middle" fill="#8888a0" font-size="10">Contour analysis, bounding box, labels</text>

    <!-- Down arrow between OpenCV and MediaPipe -->
    <line x1="682" y1="434" x2="682" y2="448" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- MediaPipe -->
    <rect x="568" y="450" width="228" height="72" rx="8" fill="#1a1e28" stroke="#8b7fef" stroke-width="1.5"/>
    <text x="682" y="473" text-anchor="middle" fill="#a89dff" font-size="13" font-weight="600">MediaPipe</text>
    <text x="682" y="491" text-anchor="middle" fill="#c0c0d0" font-size="11">Hand skeleton + pinch detection</text>
    <text x="682" y="508" text-anchor="middle" fill="#8888a0" font-size="10">21 landmarks/hand, L/R labels</text>

    <!-- Pipeline summary -->
    <rect x="568" y="536" width="228" height="28" rx="6" fill="#1a1530" stroke="#6c63ff" stroke-width="0.8"/>
    <text x="682" y="555" text-anchor="middle" fill="#b8b0ff" font-size="11" font-weight="600">Raw Frame  &#x2192;  Annotated Frame</text>

    <!-- Down arrow to output -->
    <line x1="682" y1="564" x2="682" y2="580" stroke="#6c63ff" stroke-width="1.5"/>

    <!-- Output label -->
    <rect x="600" y="578" width="164" height="24" rx="6" fill="#2d1f6e" stroke="#6c63ff" stroke-width="1"/>
    <text x="682" y="595" text-anchor="middle" fill="#d4cfff" font-size="11" font-weight="600">Annotated frames out</text>
  </g>

  <!-- Agent Logic -->
  <g>
    <rect x="830" y="316" width="168" height="240" rx="10" fill="#1e1e2e" stroke="#4a4a5a" stroke-width="1.2"/>
    <rect x="830" y="316" width="168" height="30" rx="10" fill="#2a2a38"/>
    <text x="914" y="337" text-anchor="middle" fill="#f0f0f5" font-size="13" font-weight="600">Agent Logic</text>

    <text x="914" y="365" text-anchor="middle" fill="#c0c0d0" font-size="11" font-weight="500">Function Calling</text>
    <line x1="848" y1="374" x2="980" y2="374" stroke="#3a3a4a" stroke-width="0.8"/>
    <text x="914" y="393" text-anchor="middle" fill="#8888a0" font-size="10">mark_step_complete()</text>
    <text x="914" y="411" text-anchor="middle" fill="#8888a0" font-size="10">flag_error()</text>
    <text x="914" y="429" text-anchor="middle" fill="#8888a0" font-size="10">regress_to_step()</text>

    <line x1="848" y1="440" x2="980" y2="440" stroke="#3a3a4a" stroke-width="0.8"/>
    <text x="914" y="460" text-anchor="middle" fill="#c0c0d0" font-size="11" font-weight="500">State Management</text>
    <text x="914" y="480" text-anchor="middle" fill="#8888a0" font-size="10">Step progress tracking</text>
    <text x="914" y="498" text-anchor="middle" fill="#8888a0" font-size="10">Session resumption</text>
    <text x="914" y="516" text-anchor="middle" fill="#8888a0" font-size="10">Claude vision loop</text>
    <text x="914" y="534" text-anchor="middle" fill="#8888a0" font-size="10">Stream custom events</text>
  </g>

  <!-- ==================== COLUMN 4: AI SERVICES ==================== -->
  <!-- Gemini -->
  <g filter="url(#sh)">
    <rect x="1080" y="140" width="290" height="130" rx="14" fill="#0d2a15" stroke="#34a853" stroke-width="2"/>
    <rect x="1080" y="140" width="290" height="34" rx="14" fill="#145a28"/>
    <text x="1225" y="163" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="700">Gemini 2.5 Flash</text>
    <text x="1225" y="195" text-anchor="middle" fill="#c0c0d0" font-size="13">Live API</text>
    <text x="1225" y="215" text-anchor="middle" fill="#8888a0" font-size="11">Real-time video + audio streaming</text>
    <text x="1225" y="233" text-anchor="middle" fill="#8888a0" font-size="11">Native TTS/STT, bidirectional</text>
    <text x="1225" y="251" text-anchor="middle" fill="#8888a0" font-size="11">1fps vision, context compression</text>
  </g>

  <!-- Claude Sonnet -->
  <g filter="url(#sh)">
    <rect x="1080" y="300" width="290" height="110" rx="14" fill="#2a1d10" stroke="#d4a574" stroke-width="2"/>
    <rect x="1080" y="300" width="290" height="34" rx="14" fill="#4a3020"/>
    <text x="1225" y="323" text-anchor="middle" fill="#e8c49a" font-size="15" font-weight="700">Claude Sonnet</text>
    <text x="1225" y="352" text-anchor="middle" fill="#c0c0d0" font-size="12">Periodic Vision Analysis</text>
    <text x="1225" y="372" text-anchor="middle" fill="#8888a0" font-size="11">Spatial reasoning on raw frames</text>
    <text x="1225" y="390" text-anchor="middle" fill="#8888a0" font-size="11">Step verification + regression detection</text>
  </g>

  <!-- ==================== CONNECTIONS ==================== -->

  <!-- 1. Browser <-> Stream: WebRTC -->
  <line x1="216" y1="185" x2="274" y2="185" stroke="#005fff" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="274" y1="210" x2="216" y2="210" stroke="#005fff" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="220" y="190" width="50" height="18" rx="5" fill="#0d2660"/>
  <text x="245" y="203" text-anchor="middle" fill="#4d9fff" font-size="10" font-weight="600">VP8</text>

  <!-- 2. Stream <-> Coaching Agent: WebRTC -->
  <line x1="466" y1="190" x2="535" y2="380" stroke="#005fff" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="535" y1="420" x2="466" y2="220" stroke="#005fff" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="472" y="290" width="58" height="18" rx="5" fill="#0d2660"/>
  <text x="501" y="303" text-anchor="middle" fill="#4d9fff" font-size="10" font-weight="600">WebRTC</text>

  <!-- 3. Browser -> Token Server: REST (clean horizontal path) -->
  <path d="M 216 290 L 310 290 L 310 180 L 535 180" stroke="#8888a0" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <rect x="280" y="230" width="44" height="18" rx="5" fill="#1a1a24" stroke="#4a4a5a" stroke-width="0.8"/>
  <text x="302" y="243" text-anchor="middle" fill="#c0c0d0" font-size="10" font-weight="600">REST</text>

  <!-- 4. CV Glasses -> Gemini: annotated frames (the key connection) -->
  <path d="M 764 590 L 1050 590 L 1050 220 L 1080 220" stroke="#6c63ff" stroke-width="2.5" fill="none" marker-end="url(#arr-purple)"/>
  <rect x="920" y="580" width="120" height="20" rx="6" fill="#1a1530" stroke="#6c63ff" stroke-width="0.8"/>
  <text x="980" y="594" text-anchor="middle" fill="#d4cfff" font-size="11" font-weight="600">annotated frames</text>

  <!-- 5. Gemini -> Agent Logic: voice + function calls -->
  <path d="M 1080 240 L 998 240 L 998 380" stroke="#34a853" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <rect x="1002" y="290" width="68" height="34" rx="6" fill="#0d2a15" stroke="#34a853" stroke-width="0.8"/>
  <text x="1036" y="305" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="500">voice +</text>
  <text x="1036" y="318" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="500">fn calls</text>

  <!-- 6. Agent Logic -> Token Server: coaching state -->
  <path d="M 914 316 L 914 256 L 755 256 L 755 240" stroke="#8888a0" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <rect x="798" y="247" width="90" height="18" rx="5" fill="#1a1a24" stroke="#4a4a5a" stroke-width="0.8"/>
  <text x="843" y="260" text-anchor="middle" fill="#c0c0d0" font-size="10">coaching state</text>

  <!-- 7. Agent Logic -> Claude: raw frames -->
  <path d="M 998 480 L 1050 480 L 1050 360 L 1080 360" stroke="#d4a574" stroke-width="1.8" fill="none" marker-end="url(#arr-orange)"/>
  <rect x="1002" y="430" width="78" height="18" rx="5" fill="#2a1d10" stroke="#d4a574" stroke-width="0.8"/>
  <text x="1041" y="443" text-anchor="middle" fill="#e8c49a" font-size="10" font-weight="500">raw frames</text>

  <!-- 8. Claude -> Agent Logic: insights (dashed return) -->
  <path d="M 1080 390 L 1040 390 L 1040 520 L 998 520" stroke="#d4a574" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <rect x="1002" y="510" width="56" height="18" rx="5" fill="#2a1d10" stroke="#d4a574" stroke-width="0.8"/>
  <text x="1030" y="523" text-anchor="middle" fill="#e8c49a" font-size="10">insights</text>

  <!-- ==================== LEGEND ==================== -->
  <g>
    <rect x="24" y="480" width="210" height="170" rx="10" fill="#1a1a24" stroke="#3a3a4a" stroke-width="1"/>
    <text x="129" y="506" text-anchor="middle" fill="#f0f0f5" font-size="13" font-weight="600">Data Flow Sequence</text>
    <line x1="40" y1="514" x2="218" y2="514" stroke="#3a3a4a" stroke-width="0.8"/>

    <!-- Legend items -->
    <circle cx="48" cy="536" r="10" fill="#3a3a4a" stroke="#f0f0f5" stroke-width="1.2"/>
    <text x="48" y="540" text-anchor="middle" fill="#f0f0f5" font-size="9" font-weight="700">1</text>
    <text x="66" y="540" fill="#c0c0d0" font-size="11">Camera captures frame</text>

    <circle cx="48" cy="564" r="10" fill="#0d2660" stroke="#005fff" stroke-width="1.2"/>
    <text x="48" y="568" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">2</text>
    <text x="66" y="568" fill="#c0c0d0" font-size="11">Stream delivers via WebRTC</text>

    <circle cx="48" cy="592" r="10" fill="#2d1f6e" stroke="#6c63ff" stroke-width="1.2"/>
    <text x="48" y="596" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">3</text>
    <text x="66" y="596" fill="#c0c0d0" font-size="11">CV Glasses annotate frame</text>

    <circle cx="48" cy="620" r="10" fill="#145a28" stroke="#34a853" stroke-width="1.2"/>
    <text x="48" y="624" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">4</text>
    <text x="66" y="624" fill="#c0c0d0" font-size="11">Gemini reasons + coaches</text>
  </g>

  <!-- ==================== TAGLINE ==================== -->
  <rect x="280" y="700" width="840" height="52" rx="12" fill="#13102a" stroke="#6c63ff" stroke-width="1.5" opacity="0.85"/>
  <text x="700" y="725" text-anchor="middle" fill="#d4cfff" font-size="15" font-weight="600" font-style="italic">"Gemini can reason but can't measure. Our CV layer measures, Gemini reasons."</text>
  <text x="700" y="744" text-anchor="middle" fill="#6c63ff" font-size="11" font-weight="500">GuideSight  —  Gemini Live Agent Challenge 2026</text>

</svg>
